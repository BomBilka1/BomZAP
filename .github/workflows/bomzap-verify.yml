name: BomZAP Windows verification
on:
  push:
    paths:
      - 'utils/BomZAP-auto.ps1'
      - 'utils/BomZAP-update.ps1'
      - 'tests/check-update.ps1'
      - 'tests/integration-update.ps1'
      - 'tests/check-auto.ps1'
      - 'tests/check-google-doh.ps1'
      - 'tools/BomZAP-Google-DoH.ps1'
      - 'tools/BomZAP-DNS-Win10.ps1'
      - 'tests/check-dns-win10.ps1'
      - '.github/workflows/bomzap-verify.yml'
      - 'general*.bat'
  workflow_dispatch:
jobs:
  parse-and-check-strategies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell syntax and strategy conversion
        shell: powershell
        run: ./tests/check-auto.ps1
      - name: Check updater syntax, protected files and rollback
        shell: powershell
        run: ./tests/check-update.ps1
      - name: Simulate update and preserve settings
        shell: powershell
        run: ./tests/integration-update.ps1
      - name: Check Google DoH configuration and restore
        shell: powershell
        run: ./tests/check-google-doh.ps1
      - name: Check Windows DNS proxy installation and restore
        shell: powershell
        run: ./tests/check-dns-win10.ps1
