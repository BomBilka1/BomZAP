name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v1.1.1'
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and create archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(cat .bomzap-version)
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo 'Tag does not match .bomzap-version'
            exit 1
          fi
          git archive --format=zip --prefix=BomZAP/ --output="BomZAP-v${VERSION}.zip" HEAD
          sha256sum "BomZAP-v${VERSION}.zip" > "BomZAP-v${VERSION}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            BomZAP-*.zip
            BomZAP-*.zip.sha256
